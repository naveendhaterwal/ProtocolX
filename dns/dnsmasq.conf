# dnsmasq configuration for Team ProtocolX - Phase 3 Private DNS

# Port to listen on (standard DNS port)
port=53

# Interfaces and addresses to bind
listen-address=127.0.0.1,10.7.11.221
bind-interfaces

# Do not forward plain names without a dot or domain part
domain-needed

# Do not forward addresses in the non-routed address spaces
bogus-priv

# Do not read /etc/resolv.conf to prevent lookup loops
no-resolv

# Upstream public DNS forwarders for general internet access
server=1.1.1.1
server=8.8.8.8

# Default TTL for local responses
local-ttl=30

# Private DNS mapping for ProtocolX Phase 2
# app.protocolx.test -> Shagun's Mac 2 (Nginx Edge / Load Balancer)
address=/app.protocolx.test/10.7.10.188

# DNS TTL and controlled migration record (Requirement B: ~30s TTL)
host-record=migration.protocolx.test,10.7.10.188,30
