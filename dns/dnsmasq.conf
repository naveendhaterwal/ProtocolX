# dnsmasq configuration for Team ProtocolX - Phase 3 Private DNS

# Port to listen on (standard DNS port)
port=53

# Interfaces and addresses to bind
listen-address=127.0.0.1,10.7.7.218
bind-interfaces

# Do not forward plain names without a dot or domain part
domain-needed

# Do not forward addresses in the non-routed address spaces
bogus-priv

# Do not read /etc/resolv.conf to prevent lookup loops
no-resolv

# Upstream public DNS forwarders for general internet access
server=1.1.1.1
server=8.8.8.8

# Private DNS mapping for ProtocolX
# app.protocolx.test -> Aditya's Mac 2 (nginx edge / load balancer)
address=/app.protocolx.test/10.7.12.189
