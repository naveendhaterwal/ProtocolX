# Packet Filter (PF) Rule — Backend A Isolation (Mac 3)
# Allows traffic to port 3001 ONLY from Mac 2 (Nginx Edge) and Mac 1 (Admin/Monitor)
# SSH (port 22) and all loopback communications are strictly preserved.

set skip on lo0

# Default pass for standard traffic, ensure SSH is never dropped
pass in proto tcp to any port 22

# Isolate port 3001: block incoming by default
block in quick proto tcp to any port 3001

# Whitelist Nginx Edge Gateway (Mac 2: Shagun)
pass in quick proto tcp from 10.7.10.188 to any port 3001

# Whitelist Central Control & Monitoring Server (Mac 1: Naveen)
pass in quick proto tcp from 10.7.11.221 to any port 3001
