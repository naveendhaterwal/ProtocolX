# Packet Filter (PF) Rule — Backend B Isolation (Mac 4)
# Allows traffic to port 3002 ONLY from Mac 2 (Nginx Edge) and Mac 1 (Admin/Monitor)
# SSH (port 22) and loopback communications are strictly preserved.

set skip on lo0

# Default pass for standard traffic, ensure SSH is never dropped
pass in proto tcp to any port 22

# Isolate port 3002: block incoming by default
block in quick proto tcp to any port 3002

# Whitelist Nginx Edge Gateway (Mac 2: Shagun)
pass in quick proto tcp from 10.7.10.188 to any port 3002

# Whitelist Central Control & Monitoring Server (Mac 1: Naveen)
pass in quick proto tcp from 10.7.11.221 to any port 3002
