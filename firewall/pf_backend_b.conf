# Packet Filter (PF) Rule — Backend B Isolation (Mac 4)
# Allows traffic to port 3002 ONLY from Mac 2 (Nginx Edge: 10.7.10.188).
# SSH (port 22) and loopback (lo0, used by local monitoring agent) are preserved.
# Note: Specific 'pass in quick' rules MUST precede catch-all 'block in quick' in PF.

set skip on lo0

# Ensure SSH administrative access is never dropped
pass in proto tcp to any port 22

# Whitelist ONLY Nginx Edge Gateway (Mac 2: Shagun)
pass in quick inet proto tcp from 10.7.10.188 to any port 3002

# Isolate port 3002: block all other incoming connections
block in quick proto tcp to any port 3002
