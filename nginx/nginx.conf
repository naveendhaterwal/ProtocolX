events {
    worker_connections 1024;
}

http {
    upstream protocolx_backends {
        server 10.7.16.69:3001;
        server 10.7.13.247:3002;
    }

    server {
        listen 80;
        server_name app.protocolx.test;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name app.protocolx.test;

        ssl_certificate     /Users/flexer/Documents/Projects/CN/ProtocolX/tls/app.protocolx.test.crt;
        ssl_certificate_key /Users/flexer/Documents/Projects/CN/ProtocolX/tls/app.protocolx.test.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_connect_timeout 2s;

        location /api/status {
            proxy_method GET;
            proxy_pass http://protocolx_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            
            add_header Cache-Control "public, max-age=10";
        }

        location / {
            proxy_pass http://protocolx_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
