events {
    worker_connections 1024;
}

http {
    upstream protocolx_backends {
        server 10.7.6.165:3001 max_fails=2 fail_timeout=10s;
        server 10.7.18.164:3002 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8080;
        server_name app.protocolx.test;

        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name app.protocolx.test;

        # Standby Edge TLS configuration
        ssl_certificate     /Users/flexer/Documents/Projects/CN/ProtocolX/tls/app.protocolx.test.crt;
        ssl_certificate_key /Users/flexer/Documents/Projects/CN/ProtocolX/tls/app.protocolx.test.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Standby-Edge "Active-Standby-Mac4";

        location /api/status {
            proxy_method GET;
            proxy_pass http://protocolx_backends;
            add_header Cache-Control "public, max-age=10";
            add_header X-Gateway "ProtocolX-Standby-Edge-Mac4";
        }

        location / {
            proxy_pass http://protocolx_backends;
            add_header X-Gateway "ProtocolX-Standby-Edge-Mac4";
        }
    }
}
